/* ══════════════════ render: plan (the weekly routine editor) ══════════════════ */
const WEEK_ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
function planNameInput(val, cls){
  return `<input class="ef-name plannamein ${cls||""}" list="exlist" value="${esc(val||"")}" placeholder="Exercise — start typing…" aria-label="exercise name" autocomplete="off"><div class="choices plansugg"></div>`;
}
function planRowHTML(k, x, idx, n){
  const it = x.it, o = x.o || {};
  const sc = rowScheme(x, false);
  const wd = WDAYS[DAYKEYS.indexOf(k)];
  let det = "", detCls = "";
  if (it.added){ det = "added by you"; detCls = "mine"; }
  else if (o.id){ det = `edited · was ${origName(it).toLowerCase()}`; detCls = "edited"; }
  else if (it.choices) det = "pick on the day: " + it.choices.map(c=>c.name).join(" · ");
  else if (it.detail) det = it.detail;
  if (ui.planEdit !== x.ikey){
    return `<li style="--i:${idx}"><button class="planrowbtn" data-act="planedit" data-key="${x.ikey}" aria-label="edit ${esc(rowName(x))}">
      <span class="pnum">${idx+1}</span>
      <span class="pmain"><span class="pname">${esc(rowName(x))}</span>${det?`<span class="pdet ${detCls}">${esc(det)}</span>`:""}</span>
      <span class="scheme">${esc(sc.sets)} × ${esc(sc.reps)}</span>
    </button></li>`;
  }
  const custom = !it.added && (o.id || o.sets || o.reps);
  return `<li class="planedit" style="--i:${idx}"><div class="editform">
    ${planNameInput(rowName(x))}
    ${it.choices && !o.id ? `<div class="ef-note">Keep “${esc(it.label)}” to choose on the day — or type one exercise to lock it in.</div>` : ""}
    <div class="ef-row">
      <label>sets<input class="ef-sets" inputmode="numeric" value="${esc(sc.sets)}"></label>
      <label>reps<input class="ef-reps" value="${esc(sc.reps)}"></label>
    </div>
    <div class="ef-btns">
      <button class="choice sel" data-act="plansave" data-key="${x.ikey}">save</button>
      <button class="choice" data-act="planeditcancel">cancel</button>
      <span class="ef-move">
        <button class="choice" data-act="planmove" data-dir="-1" data-key="${x.ikey}" aria-label="move up" ${idx===0?"disabled":""}>↑</button>
        <button class="choice" data-act="planmove" data-dir="1" data-key="${x.ikey}" aria-label="move down" ${idx===n-1?"disabled":""}>↓</button>
      </span>
    </div>
    <div class="ef-btns">
      <button class="plandel" data-act="planremove" data-key="${x.ikey}">remove from ${esc(wd)}s</button>
      ${custom?`<button class="plandel" data-act="planrevert" data-key="${x.ikey}">back to the original</button>`:""}
    </div>
  </div></li>`;
}
function renderPlan(){
  const k = ui.planDay, day = PLAN[k], rt = dayRt(k);
  const wd = WDAYS[DAYKEYS.indexOf(k)];
  const rows = routineRows(k);
  const vis = rows.filter(x=>!isHidden(x));
  const hiddenN = rows.length - vis.length;
  const ed = ui.planEdit;

  let h = `<div class="pagehead"><h2>Your week</h2>
    <p>Shape what each day holds — changes carry into every week.</p></div>`;
  h += `<div class="plandays" role="tablist" aria-label="weekday">` + WEEK_ORDER.map(d=>
    `<button class="planday ${d===k?'on':''}" data-act="planday" data-day="${d}" role="tab" aria-selected="${d===k}">${WDAYS[DAYKEYS.indexOf(d)].slice(0,3)}${dayEdited(d)?'<i aria-label="edited"></i>':''}</button>`
  ).join("") + `</div>`;

  /* the day card — its name is editable too */
  h += `<div class="dayhead plancard" data-day="${k}">
    <div class="datebar"><div class="dateline plandl">every ${esc(wd)}</div>${ed!=="@title"?`<button class="kickedit" data-act="planfield" data-field="title">rename</button>`:""}</div>`;
  if (ed==="@title"){
    h += `<div class="editform" style="margin-top:0">
      <input class="ef-name plantitlein" value="${esc(dayTitle(k).replace(/\n/g," "))}" aria-label="day name">
      <div class="ef-btns">
        <button class="choice sel" data-act="planfieldsave" data-field="title">save</button>
        <button class="choice" data-act="planeditcancel">cancel</button>
      </div></div>`;
  } else {
    h += `<h1>${esc(dayTitle(k)).replace(/\n/g,"<br>")}</h1>`;
  }
  const sub = day.sub || (day.rest ? (vis.length ? "rest day, turned training day" : "rest day") : "");
  if (sub) h += `<div class="sub">${esc(sub)}</div>`;
  h += `</div>`;

  if (day.recovery) h += `<p class="plannote">The recovery blocks — posture, Pilates or a walk — stay as they are. Anything you add here shows up underneath them.</p>`;
  else if (day.rest && !vis.length) h += `<p class="plannote">${esc(day.line)} Add an exercise below to turn it into a training day.</p>`;

  /* warm-up */
  const showExtras = !day.recovery && (!day.rest || vis.length);
  if (showExtras){
    const warm = dayWarmup(k);
    h += `<div class="plansec"><div class="workkicker"><span>Warm-up</span>${ed!=="@warmup"?`<button class="kickedit" data-act="planfield" data-field="warmup">edit</button>`:""}</div>`;
    if (ed==="@warmup"){
      h += `<div class="editform">
        <textarea class="clnotes planwarmin" rows="${Math.max(4, warm.length+1)}" placeholder="One move per line" aria-label="warm-up, one per line">${esc(warm.join("\n"))}</textarea>
        <div class="ef-btns">
          <button class="choice sel" data-act="planfieldsave" data-field="warmup">save</button>
          <button class="choice" data-act="planeditcancel">cancel</button>
          ${rt.warmup?`<button class="plandel" data-act="planfieldreset" data-field="warmup" style="margin-left:auto">original</button>`:""}
        </div></div>`;
    } else if (warm.length){
      h += `<ul class="planwarm">${warm.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`;
    } else {
      h += `<p class="plannone">No warm-up.</p>`;
    }
    h += `</div>`;
  }

  /* main work */
  h += `<div class="plansec"><div class="workkicker"><span>${day.recovery?"Added to recovery day":"Main work"}</span><em class="plancount">${vis.length} ${vis.length===1?"exercise":"exercises"}</em></div>
    <ol class="planlist">`;
  vis.forEach((x,i)=>{ h += planRowHTML(k, x, i, vis.length); });
  h += `<li class="planaddrow">`;
  if (ui.planAdding){
    h += `<div class="editform">
      ${planNameInput("", "planaddname")}
      <div class="ef-row">
        <label>sets<input class="ef-sets" inputmode="numeric" value="3"></label>
        <label>reps<input class="ef-reps" value="10"></label>
      </div>
      <div class="ef-btns">
        <button class="choice sel" data-act="planaddsave">add to ${esc(wd)}</button>
        <button class="choice" data-act="planaddcancel">cancel</button>
      </div></div>`;
  } else {
    h += `<button class="addex" data-act="planadd"><span>＋</span>add an exercise to every ${esc(wd)}</button>`;
  }
  h += `</li></ol>`;
  if (hiddenN) h += `<div class="skipnote">${hiddenN} removed · <button class="restorelink" data-act="planrestore">restore</button></div>`;
  h += `</div>`;

  /* finisher */
  if (showExtras){
    const fin = dayFinish(k);
    h += `<div class="plansec"><div class="workkicker"><span>Finish</span>${ed!=="@finish"?`<button class="kickedit" data-act="planfield" data-field="finish">edit</button>`:""}</div>`;
    if (ed==="@finish"){
      h += `<div class="editform">
        <textarea class="clnotes planfinin" rows="2" placeholder="e.g. Stairmaster 10 min" aria-label="finisher">${esc(fin)}</textarea>
        <div class="ef-btns">
          <button class="choice sel" data-act="planfieldsave" data-field="finish">save</button>
          <button class="choice" data-act="planeditcancel">cancel</button>
          ${("finish" in rt)?`<button class="plandel" data-act="planfieldreset" data-field="finish" style="margin-left:auto">original</button>`:""}
        </div></div>`;
    } else {
      h += fin ? `<p class="planfin">${esc(fin)}</p>` : `<p class="plannone">No finisher.</p>`;
    }
    h += `</div>`;
  }

  h += `<div class="plansec planfoot">
    <button class="kickedit" data-act="plantoday" data-day="${k}">see it on Today →</button>
    ${dayEdited(k)?`<button class="cleardaylink" data-act="planreset">Reset ${esc(wd)} to the original plan…</button>`:""}
  </div>`;
  $("#view-plan").innerHTML = h;
}

/* the last eight program weeks at a glance — one column of dots per week,
   a dot per planned session, filled for each one she finished */
function rhythmHTML(){
  const wk = weeksIn(), planned = plannedPerWeek();
  const first = Math.max(1, wk-7);
  let done = 0, total = 0, cols = "";
  for (let k=first; k<=wk; k++){
    const [a, b] = weekRange(k);
    const n = stampedIn(a, b);
    const cur = k===wk;
    if (!cur){ done += n; total += planned; }
    const slots = Math.max(planned, n);
    let dots = "";
    for (let d=0; d<slots; d++) dots += `<i class="${d<n?"on":""}${d>=planned?" extra":""}"></i>`;
    cols += `<button class="rwk ${cur?"cur":""}" data-act="rhythmwk" data-dk="${a}" aria-label="Week ${k}: ${n} of ${planned} sessions${cur?", so far":""}">
      <span class="rdots">${dots}</span><span class="rlbl">${cur?"now":"W"+k}</span></button>`;
  }
  const weeks = wk - first;
  return `<div class="rhythm">
    <div class="rhead"><span>Last ${weeks+1} weeks</span>${weeks?`<em>${done} of ${total} sessions${total?` · ${Math.round(done/total*100)}%`:""}</em>`:""}</div>
    <div class="rcols">${cols}</div>
  </div>`;
}

/* ══════════════════ render: history ══════════════════ */
function renderLog(){
  const [y,m] = ui.calMonth;
  const first = new Date(y,m,1);
  const start = new Date(first);
  start.setDate(1 - first.getDay()); /* back to Sunday */
  const today = new Date();

  let h = `<div class="pagehead"><h2>Record</h2>
    <p>Week ${weeksIn()} of the program · ${sessionsLogged()} ${sessionsLogged()===1?'session':'sessions'} logged</p></div>`;
  h += rhythmHTML();
  h += `<div class="calhead"><h3>${MONTHS[m]} ${y}</h3>
    <div class="mnav">
      <button data-act="mnav" data-dir="-1" aria-label="previous month">‹</button>
      <button data-act="mnav" data-dir="1" aria-label="next month">›</button>
    </div></div>`;
  h += `<div class="calgrid">`;
  for (const w of ["S","M","T","W","T","F","S"]) h += `<div class="dow">${w}</div>`;
  const cur = new Date(start);
  for (let i=0;i<42;i++){
    const dk = key(cur);
    const inMonth = cur.getMonth()===m;
    const w = db.workouts[dk];
    const stamped = w && w.stamped;
    const cls = ["cal-day", inMonth?"":"other", sameDay(cur,today)?"today":"", dk===ui.calSel?"sel":"", stamped?"stamped":""].filter(Boolean).join(" ");
    h += `<div class="cal-cell"><button class="${cls}" data-act="calsel" data-dk="${dk}">${cur.getDate()}${stamped?`<span class="seal">${hankoSVG()}</span>`:''}</button></div>`;
    cur.setDate(cur.getDate()+1);
    if (i>=34 && cur.getMonth()!==m && cur.getDay()===0) break;
  }
  h += `</div>`;

  /* selected-day detail */
  const sel = ui.calSel;
  if (sel){
    const d = fromKey(sel);
    const w = db.workouts[sel];
    const dayKey = (w && w.session) || DAYKEYS[d.getDay()];
    h += `<div class="daydetail">
      <div class="dl-date">${WDAYS[d.getDay()]} · ${MONTHS[d.getMonth()]} ${d.getDate()}</div>
      <h4>${esc(dayTitle(dayKey)).replace(/\n/g," ")} ${w&&w.stamped?'<span style="color:var(--hanko);font-size:.72rem;font-family:var(--sans);font-weight:600;letter-spacing:.1em">✓ COMPLETE</span>':''}</h4>`;
    const entries = w ? Object.entries(w.entries||{}).filter(([,e])=>e && countsEntry(w,e) && (e.weight!=null&&e.weight!=="" || e.done || (e.sets||[]).some(Boolean) || e.reps || e.mins)) : [];
    if (entries.length){
      h += `<ul>`;
      for (const [ex,e] of entries){
        const pn = (e.sets && e.sets.length) || plannedSets(dayKey, ex);
        const pf = setsDone(e, pn);
        if (ui.logEdit && ui.logEdit.dk===sel && ui.logEdit.ex===ex){
          const isMins = e.mins!=null || ex==="mat-pilates" || ex==="light-walk";
          h += `<li class="ledit">
            <span class="lename">${esc(nameOf(ex))}</span>
            <div class="ledrow">
              ${pn>1?editPipsHTML(ex, pn, pf, sel):""}
              ${isMins
                ?`<input class="ler" inputmode="numeric" data-mins="1" value="${e.mins?esc(e.mins):""}" placeholder="min" aria-label="minutes">`
                :`<input class="lew" inputmode="decimal" value="${e.weight!=null&&e.weight!==""?esc(e.weight):""}" placeholder="lb" aria-label="weight"><input class="ler" value="${e.reps?esc(e.reps):""}" placeholder="reps" aria-label="reps">`}
              <button class="choice sel" data-act="logeditsave" data-dk="${sel}" data-ex="${ex}">save</button>
              <button class="choice" data-act="logeditcancel">cancel</button>
            </div>
          </li>`;
          continue;
        }
        const done = e.done || (e.sets||[]).some(Boolean);
        const st = pn>1 && pf>0 && pf<pn ? `${pf}/${pn}` : "";
        const right = (e.weight!=null&&e.weight!=="") ? `${e.weight} lb${e.reps?`<small>× ${esc(e.reps)}</small>`:''}` : e.mins ? `${esc(e.mins)} min` : (e.reps?`× ${esc(e.reps)}`:'—');
        h += `<li><button class="lerow" data-act="logedit" data-dk="${sel}" data-ex="${ex}" aria-label="edit ${esc(nameOf(ex))}"><span>${esc(nameOf(ex))}${done?' <span style="color:var(--hanko)">✓</span>':''}</span><span class="r">${right}${st?`<small> · ${st} sets</small>`:''}</span></button><button class="delentry" data-act="delentry" data-dk="${sel}" data-ex="${ex}" aria-label="delete this entry">×</button></li>`;
      }
      h += `</ul>`;
    } else {
      h += `<p class="empty">${w&&w.stamped ? "Complete, nothing written down — some days are like that." : "Nothing logged."}</p>`;
    }
    h += noteHTML(w, sel);
    if (w && (w.stamped || entries.length)){
      h += `<button class="cleardaylink" data-act="clearday" data-dk="${sel}">Clear this day…</button>`;
    }
    h += `</div>`;
  }

  h += `<div class="datazone">
    <p>Everything lives on this device. Export a copy now and then — paper burns, JSON doesn't.
      <br>Last backup: ${db.settings.lastExport ? fmtShort(db.settings.lastExport) : "never"}.</p>
    <div class="row">
      <button class="databtn" data-act="export">export</button>
      <button class="databtn" data-act="import">import</button>
    </div>
  </div>`;
  $("#view-log").innerHTML = h;
}

/* ══════════════════ render: progress ══════════════════ */
function series(exId){
  if (seriesMemo[exId]) return seriesMemo[exId];
  const out = seriesMemo[exId] = [];
  for (const dk of Object.keys(db.workouts).sort()){
    const w = db.workouts[dk];
    const e = w.entries && w.entries[exId];
    if (e && countsEntry(w, e) && e.weight != null && e.weight !== "" && !isNaN(parseFloat(e.weight)))
      out.push({dk, w:parseFloat(e.weight), reps:e.reps});
  }
  return out;
}
function chartSVG(pts, label){
  const W=340, H=120, padL=34, padR=16, padT=14, padB=22;
  const ws = pts.map(p=>p.w);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  if (lo===hi){ lo-=5; hi+=5; }
  const span = hi-lo, pad = span*0.18;
  lo-=pad; hi+=pad;
  const X = i => pts.length===1 ? W/2 : padL + (W-padL-padR)*(i/(pts.length-1));
  const Y = w => padT + (H-padT-padB)*(1-(w-lo)/(hi-lo));
  const yTop = Math.max(...ws), yBot = Math.min(...ws);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label||"weight"} over time">`;
  s += `<line class="grid" x1="${padL}" y1="${Y(yTop)}" x2="${W-padR}" y2="${Y(yTop)}"/>`;
  if (yBot!==yTop) s += `<line class="grid" x1="${padL}" y1="${Y(yBot)}" x2="${W-padR}" y2="${Y(yBot)}"/>`;
  s += `<text x="${padL-6}" y="${Y(yTop)+3.5}" text-anchor="end">${yTop}</text>`;
  if (yBot!==yTop) s += `<text x="${padL-6}" y="${Y(yBot)+3.5}" text-anchor="end">${yBot}</text>`;
  if (pts.length>1){
    s += `<polyline class="ln" pathLength="1" points="${pts.map((p,i)=>X(i)+","+Y(p.w)).join(" ")}"/>`;
  }
  pts.forEach((p,i)=>{
    s += `<circle class="pt ${i===pts.length-1?'last':''}" cx="${X(i)}" cy="${Y(p.w)}" r="3.4"/>`;
  });
  s += `<text x="${X(0)}" y="${H-6}" text-anchor="${pts.length===1?'middle':'start'}">${fmtShort(pts[0].dk)}</text>`;
  if (pts.length>1) s += `<text x="${X(pts.length-1)}" y="${H-6}" text-anchor="end">${fmtShort(pts[pts.length-1].dk)}</text>`;
  s += `</svg>`;
  return s;
}
/* reps climbing at the same weight is progress too — double progression made visible */
function repTrend(pts){
  const a = pts[0], b = pts[pts.length-1];
  if (!a.reps || !b.reps) return null;
  const r0 = repLow(a.reps), r1 = repLow(b.reps);
  if (r0 && r1 && r1 > r0) return `reps climbing · ${esc(a.reps)} → ${esc(b.reps)} at ${b.w} lb`;
  return null;
}
function progRowHTML(id, i){
  const pts = series(id);
  const first = pts[0].w, latest = pts[pts.length-1].w;
  const delta = latest - first;
  let dTxt, dCls = "";
  if (pts.length===1) dTxt = "first entry";
  else if (ASSISTED[id]){
    /* logged weight is assistance — down is the win */
    if (delta<0) dTxt = `−${Math.abs(delta)} lb assist since ${fmtShort(pts[0].dk)} · stronger`;
    else if (delta>0){ dTxt = `＋${delta} lb assist`; dCls = "zero"; }
    else { const rt = repTrend(pts); dTxt = rt || "holding steady"; if (!rt) dCls = "zero"; }
  }
  else if (delta>0) dTxt = `＋${delta} lb since ${fmtShort(pts[0].dk)}`;
  else if (delta<0) dTxt = `−${Math.abs(delta)} lb`;
  else { const rt = repTrend(pts); dTxt = rt || "holding steady"; if (!rt) dCls = "zero"; }
  const open = ui.progOpen===id;
  let h = `<li style="--i:${i}">
    <button class="prow" data-act="prog" data-ex="${id}" aria-expanded="${open}">
      <span class="lft">
        <span class="nm">${esc(nameOf(id))}</span>
        <span class="delta ${dCls}">${dTxt}</span>
      </span>
      <span class="latest">${latest} lb${DETAILS[id]?`<small style="font-family:var(--sans);font-weight:400;font-size:.62rem;color:var(--ink-2)"> ${DETAILS[id]}</small>`:''}</span>
    </button>`;
  if (open){
    h += `<div class="pbody">${chartSVG(pts)}<ul class="pentries">`;
    for (const p of [...pts].reverse()){
      h += `<li><span>${fmtShort(p.dk)}</span><span class="r">${p.w} lb${p.reps?`<small>× ${esc(p.reps)}</small>`:''}</span></li>`;
    }
    h += `</ul></div>`;
  }
  return h + `</li>`;
}
/* bodyweight moves have no weight to chart — their progress is the reps she typed */
function repSeries(exId){
  const out = [];
  for (const dk of Object.keys(db.workouts).sort()){
    const w = db.workouts[dk], e = w.entries && w.entries[exId];
    if (!e || !countsEntry(w, e) || (e.weight != null && e.weight !== "")) continue;
    const r = repsGot(e);
    if (r != null) out.push({dk, w:r});
  }
  return out;
}
function repRowHTML(id, i){
  const pts = repSeries(id);
  const first = pts[0].w, latest = pts[pts.length-1].w, best = Math.max(...pts.map(p=>p.w));
  const delta = latest - first;
  let dTxt, dCls = "";
  if (pts.length===1) dTxt = "first entry";
  else if (delta>0) dTxt = `＋${delta} ${delta===1?"rep":"reps"} since ${fmtShort(pts[0].dk)}`;
  else if (best > latest) { dTxt = `best so far · ${best} reps`; dCls = "zero"; }
  else { dTxt = "holding steady"; dCls = "zero"; }
  const open = ui.progOpen===id;
  let h = `<li style="--i:${i}">
    <button class="prow" data-act="prog" data-ex="${id}" aria-expanded="${open}">
      <span class="lft">
        <span class="nm">${esc(nameOf(id))}</span>
        <span class="delta ${dCls}">${dTxt}</span>
      </span>
      <span class="latest">${latest}<small class="unitsm"> reps</small></span>
    </button>`;
  if (open){
    h += `<div class="pbody">${chartSVG(pts, "reps")}<ul class="pentries">`;
    for (const p of [...pts].reverse()) h += `<li><span>${fmtShort(p.dk)}</span><span class="r">${p.w}<small>reps</small></span></li>`;
    h += `</ul></div>`;
  }
  return h + `</li>`;
}
function renderProgress(){
  const all = new Set([...Object.keys(NAMES), ...Object.keys(LIBNAMES), ...Object.keys(db.customNames)]);
  for (const e of db.customLib) all.add(e.id);
  const tracked = [...all].filter(id=>series(id).length>0);
  for (const id of loggedIds()) all.add(id);
  const repTracked = [...all].filter(id=>!tracked.includes(id) && repSeries(id).length>0)
    .sort((a,b)=>{ const x = repSeries(a), y = repSeries(b); return y[y.length-1].dk.localeCompare(x[x.length-1].dk); });
  let h = `<div class="pagehead"><h2>Progress</h2>
    <p>Weight over time, one lift at a time.</p></div>` + checkInHTML("progress");
  const repGroup = start => !repTracked.length ? "" :
    `<div class="pgroup">Bodyweight · reps<small>the reps you type in</small></div><ul class="plist">`
    + repTracked.map((id,n)=>repRowHTML(id, start+n)).join("") + `</ul>`;
  if (!tracked.length && repTracked.length){
    $("#view-progress").innerHTML = h + repGroup(0);
    return;
  }
  if (!tracked.length){
    h += `<div class="pempty">
      <img class="bunnygif" src="assets/ui/bunny.gif" alt="a patient bunny">
      <p>Nothing here yet — weights you mark done on the Today page gather into charts here. The first entry is the hardest one.</p></div>`;
    $("#view-progress").innerHTML = h;
    return;
  }
  const keys = KEY_LIFTS.filter(id=>tracked.includes(id));
  const lastDk = id => { const p = series(id); return p[p.length-1].dk; };
  const rest = tracked.filter(id=>!KEY_LIFTS.includes(id)).sort((a,b)=>lastDk(b).localeCompare(lastDk(a)));
  let i = 0;
  if (keys.length){
    h += `<div class="pgroup">Key lifts<small>where adding weight matters most</small></div><ul class="plist">`;
    for (const id of keys) h += progRowHTML(id, i++);
    h += `</ul>`;
  }
  if (rest.length){
    h += `<div class="pgroup">${keys.length?"Accessories &amp; extras":"Tracked"}<small>most recent first</small></div><ul class="plist">`;
    for (const id of rest) h += progRowHTML(id, i++);
    h += `</ul>`;
  }
  h += repGroup(i);
  $("#view-progress").innerHTML = h;
}

/* ══════════════════ render: library ══════════════════ */
/* where a library exercise appears in the weekly plan — plan ids ≠ library ids, so match by name too */
function normEx(s){ return s.toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function exMatches(libEntry, planId){
  if (libEntry.id === planId) return true;
  const a = normEx(libEntry.name), b = normEx(nameOf(planId));
  return !!a && !!b && (a===b || a.startsWith(b) || b.startsWith(a));
}
function planSpots(libEntry){
  const spots = [];
  for (const dk of DAYKEYS){
    for (const x of routineRows(dk)){
      if (isHidden(x)) continue;
      const it = x.it, o = x.o || {};
      const hit = o.id ? exMatches(libEntry, o.id)
        : it.choices ? it.choices.some(c=>exMatches(libEntry, c.id))
        : exMatches(libEntry, it.id);
      const sc = rowScheme(x, false);
      if (hit) spots.push({day:dk, key:x.ikey, sets:sc.sets, reps:sc.reps, slotLabel:(it.choices && !o.id)?it.label:null});
    }
  }
  return spots;
}
function libPlanHTML(e){
  const spots = planSpots(e);
  if (!spots.length) return "";
  let h = `<div class="libplan"><div class="libplanhead">in your plan</div><div class="libslots">`;
  for (const s of spots){
    const editing = ui.libSpot && ui.libSpot.day===s.day && ui.libSpot.key===s.key;
    if (editing){
      h += `</div><div class="editform" style="margin:.4rem 0 .6rem">
        <div class="ef-row">

          <button class="choice" data-act="libslotcancel">cancel</button>

    } else {
      h += `<button class="libslot" data-act="libslot" data-day="${s.day}" data-key="${s.key}">${WDAYS[DAYKEYS.indexOf(s.day)].slice(0,3)} · ${s.sets} × ${esc(s.reps)}${s.slotLabel?`<small>${esc(s.slotLabel).toLowerCase()}</small>`:""}</button>`;

  }
  return h + `</div></div>`;
}

function processLibImage(file, cb){
  if (file.type === "image/gif"){
    if (file.size > 2.5*1024*1024){ alert("That gif is a little large — try one under 2.5 MB."); return; }
    const rd = new FileReader();
    rd.onload = ()=>cb(rd.result);
    rd.readAsDataURL(file);
    return;
  }
  const rd = new FileReader();
  rd.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const scale = Math.min(1, 640/Math.max(im.width, im.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(im.width*scale); cv.height = Math.round(im.height*scale);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", .82));
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ══════════════════ render dispatch ══════════════════ */
function render(){
  $("#view-today").hidden = ui.tab!=="today";
  $("#view-plan").hidden = ui.tab!=="plan";
  $("#view-log").hidden = ui.tab!=="log";
  $("#view-progress").hidden = ui.tab!=="progress";
  $("#view-library").hidden = ui.tab!=="library";
  document.querySelectorAll(".tab").forEach(t=>{
    const on = t.dataset.tab===ui.tab;
    t.classList.toggle("active", on);
    t.setAttribute("aria-selected", on);
  });
  const eb = $("#expressBtn");
  eb.classList.toggle("on", db.settings.express);
  eb.setAttribute("aria-pressed", db.settings.express);
  if (ui.tab==="today") renderToday();
  else if (ui.tab==="plan") renderPlan();
  else if (ui.tab==="log") renderLog();
  else if (ui.tab==="library") renderLibrary();
  else renderProgress();
}

/* ══════════════════ events ══════════════════ */
document.addEventListener("click", e=>{
  if (ui.rowOpen && !e.target.closest(".rowactions") && !e.target.closest('[data-act="rowmore"]')){
    ui.rowOpen = null;
    document.querySelectorAll("li.exrow.open").forEach(li=>li.classList.remove("open"));
  }
  const t = e.target.closest("[data-act],[data-tab],#expressBtn");
  if (!t) return;

  if (t.id==="expressBtn"){ db.settings.express=!db.settings.express; save(); render(); return; }
  if (t.dataset.tab){
    ui.tab=t.dataset.tab; render(); window.scrollTo(0,0);
    const v = $("#view-"+ui.tab);
    if (v){ v.classList.remove("tabfade"); void v.offsetWidth; v.classList.add("tabfade"); }
    return;
  }

  const act = t.dataset.act;
  if (act==="daynav"){
    const d = fromKey(ui.viewDate); d.setDate(d.getDate()+Number(t.dataset.dir));
    ui.viewDate = key(d); render(); return;
  }
  if (act==="gotoday"){
    ui.viewDate = key(new Date()); renderToday(); return;
  }
  if (act==="wedmode"){
    const r = rec(ui.viewDate, true);
    r.wedMode = t.dataset.mode;
    save(); renderToday(); return;
  }
  if (act==="check"){
    const r = rec(ui.viewDate, true);
    r.checks[t.dataset.cid] = !r.checks[t.dataset.cid];
    save(); renderToday(); return;
  }
  if (act==="choose"){
    const r = rec(ui.viewDate, true);
    r.choices[t.dataset.slot] = t.dataset.cid;
    ui.slotPick = null;
    save(); renderToday(); return;
  }
  if (act==="slotpick"){
    ui.slotPick = ui.slotPick===t.dataset.slot ? null : t.dataset.slot;
    renderToday(); return;
  }
  if (act==="cue"){
    ui.cueOpen = ui.cueOpen===t.dataset.key ? null : t.dataset.key;
    renderToday(); return;
  }
  if (act==="openlib"){
    ui.tab = "library"; ui.libOpen = t.dataset.id; ui.libq = "";
    render(); window.scrollTo(0,0);
    const row = document.querySelector(`[data-act="lib"][data-id="${t.dataset.id}"]`);
    if (row) row.scrollIntoView({block:"center"});
    return;
  }
  if (act==="done"){
    const r = rec(ui.viewDate, true);
    const ex = t.dataset.ex;
    const entry = r.entries[ex] = r.entries[ex] || {};
    const cur = !!entry.done;
    /* "done" means finished with this lift, not necessarily all the planned sets —
       a partial pip count stands, so stopping at 2 of 3 logs as 2 of 3. */
    if (cur) delete entry.done;
    else {
      entry.done = true;
      if (entry.sets && !entry.sets.some(s=>!s)) delete entry.sets;
      inheritInto(entry, ex, t.dataset.reps);
      heartBurst(t, 6);
    }
    save(); renderToday();
    if (!cur){
      const ring = document.querySelector(`.donebtn[data-ex="${ex}"] .ring`);
      if (ring) ring.classList.add("pop");
    }
    return;
  }
  if (act==="pip"){
    /* fill-to-point: tapping pip N fills 1..N; tapping the last filled pip steps back one */
    const dk = t.dataset.dk || ui.viewDate;
    const r = rec(dk, true);
    const ex = t.dataset.ex, si = Number(t.dataset.si), n = Number(t.dataset.n);
    const entry = r.entries[ex] = r.entries[ex] || {};
    const wasDone = !!entry.done;
    if (!db.seen.sethint) db.seen.sethint = 1;
    const cur = setsDone(entry, n);
    const tapped = si + 1;
    const next = cur===tapped ? tapped-1 : tapped;
    if (next<=0){ delete entry.sets; delete entry.done; }
    else if (next>=n){ entry.done = true; delete entry.sets; }
    else {
      /* short of the plan — keep it marked done if it already was, so she can
         dial a finished lift down to the sets she actually did */
      entry.sets = Array.from({length:n},(_,k)=>k<next);
      if (!wasDone) delete entry.done;
    }
    if (cur===0 && next>0 && !t.dataset.dk){
      const slide = t.closest(".rowslide");
      const dbtn = slide && slide.querySelector(".donebtn");
      inheritInto(entry, ex, dbtn ? dbtn.dataset.reps : null);
    }
    const justFinished = entry.done && !wasDone;
    if (justFinished) heartBurst(t, 6);
    save();
    if (ui.tab==="log") renderLog(); else renderToday();
    if (justFinished){
      const ring = document.querySelector(`.donebtn[data-ex="${ex}"] .ring`);
      if (ring) ring.classList.add("pop");
    }
    return;
  }
  if (act==="swap"){
    ui.swapping = t.dataset.key;
    ui.rowOpen = null;
    renderToday();
    const inp = document.querySelector(".swapin");
    if (inp) inp.focus();
    return;
  }
  if (act==="unswap"){
    const r = rec(ui.viewDate, true);
    delete r.subs[t.dataset.key];
    ui.rowOpen = null;
    save(); renderToday(); return;
  }
  if (act==="rowmore"){
    const k = t.dataset.key;
    ui.rowOpen = ui.rowOpen===k ? null : k;
    if (!db.seen.rowhint || !db.seen.sethint){ db.seen.rowhint = 1; db.seen.sethint = 1; save(); }
    renderToday(); return;
  }
  if (act==="notedit"){
    ui.noting = t.dataset.dk;
    if (ui.tab==="log") renderLog(); else renderToday();
    const ta = document.querySelector(".notein");
    if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  if (act==="logedit"){
    ui.logEdit = {dk:t.dataset.dk, ex:t.dataset.ex};
    renderLog();
    const inp = document.querySelector(".lew") || document.querySelector(".ler");
    if (inp) inp.focus();
    return;
  }
  if (act==="logeditcancel"){ ui.logEdit = null; renderLog(); return; }
  if (act==="logeditsave"){
    const li = t.closest("li");
    const w = db.workouts[t.dataset.dk];
    const e2 = w && w.entries && w.entries[t.dataset.ex];
    if (li && e2){
      const lew = li.querySelector(".lew"), ler = li.querySelector(".ler");
      if (ler && ler.dataset.mins) e2.mins = ler.value.trim();
      else {
        if (lew){ const v = parseFloat(lew.value); e2.weight = isNaN(v) ? "" : v; }
        if (ler) e2.reps = ler.value.trim();
      }
    }
    ui.logEdit = null;
    save(); renderLog(); return;
  }
  if (act==="rowedit"){
    ui.editing = t.dataset.key;
    ui.rowOpen = null;
    renderToday();
    const inp = document.querySelector(".ef-name");
    if (inp) inp.focus();
    return;
  }
  if (act==="editcancel"){ ui.editing = null; renderToday(); return; }
  if (act==="editsave"){
    const li = t.closest("li.exrow");
    if (li) saveRoutineItem(sessOf(ui.viewDate), t.dataset.key, {
      name: li.querySelector(".ef-name").value,
      sets: li.querySelector(".ef-sets").value,
      reps: li.querySelector(".ef-reps").value
    });
    ui.editing = null;
    save(); renderToday(); return;
  }
  if (act==="edithide" || act==="rowremove"){
    removeRoutineItem(sessOf(ui.viewDate), t.dataset.key);
    ui.editing = null; ui.rowOpen = null;
    save(); renderToday(); return;
  }
  if (act==="restorehidden"){
    restoreHidden(sessOf(ui.viewDate));
    save(); renderToday(); return;
  }
  if (act==="addex"){
    ui.adding = true;
    renderToday();
    const inp = document.querySelector('.swapin[data-adding]');
    if (inp) inp.focus();
    return;
  }
  if (act==="rmex"){
    const r = rec(ui.viewDate, true);
    r.extras = r.extras.filter(x=>x!==t.dataset.id);
    ui.rowOpen = null;
    save(); renderToday(); return;
  }
  if (act==="lib"){
    ui.libOpen = ui.libOpen===t.dataset.id ? null : t.dataset.id;
    const rows = document.getElementById("librows");
    if (rows) rows.innerHTML = libRowsHTML();
    return;
  }
  if (act==="libadd"){
    ui.libAdding = true; ui.libEditId = null; ui.libImg = null;
    renderLibrary();
    const inp = document.getElementById("clName");
    if (inp) inp.focus();
    return;
  }
  if (act==="libedit"){
    ui.libEditId = t.dataset.id; ui.libAdding = false; ui.libImg = null;
    renderLibrary();
    window.scrollTo(0,0);
    const inp = document.getElementById("clName");
    if (inp) inp.focus();
    return;
  }
  if (act==="libcancel"){ ui.libAdding = false; ui.libEditId = null; ui.libImg = null; renderLibrary(); return; }
  if (act==="libsave"){
    const name = (document.getElementById("clName").value||"").trim();
    if (!name){ document.getElementById("clName").focus(); return; }
    const cat = document.getElementById("clCat").value;
    const notes = (document.getElementById("clNotes").value||"").trim();
    const cues = notes ? notes.split("\n").map(s=>s.trim()).filter(Boolean) : [];
    const ed = ui.libEditId ? db.customLib.find(x=>x.id===ui.libEditId) : null;
    if (ed){
      ed.name = name; ed.cat = cat; ed.cues = cues;
      if (ui.libImg) ed.img = ui.libImg;
      ui.libOpen = ed.id;
    } else {
      let id = "my-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
      while (NAMES[id] || LIBNAMES[id] || db.customLib.some(e=>e.id===id)) id += "-2";
      db.customLib.push({id, name, cat, hits:"", cues, img: ui.libImg || undefined, mine:true});
      ui.libOpen = id;
    }
    ui.libAdding = false; ui.libEditId = null; ui.libImg = null;
    save(); buildDatalist(); renderLibrary(); return;
  }
  if (act==="libslot"){
    const cur = ui.libSpot;
    ui.libSpot = (cur && cur.day===t.dataset.day && cur.key===t.dataset.key) ? null : {day:t.dataset.day, key:t.dataset.key};
    const rows = document.getElementById("librows");
    if (rows) rows.innerHTML = libRowsHTML();
    const inp = document.querySelector(".libplan ~ .editform .ef-sets") || document.querySelector("#librows .ef-sets");
    if (inp) inp.focus();
    return;
  }
  if (act==="libslotcancel"){
    ui.libSpot = null;
    const rows = document.getElementById("librows");
    if (rows) rows.innerHTML = libRowsHTML();
    return;
  }
  if (act==="libslotsave"){
    const wrap = t.closest(".editform");
    if (wrap){
      saveRoutineItem(t.dataset.day, t.dataset.key, {
        sets: wrap.querySelector(".ef-sets").value,
        reps: wrap.querySelector(".ef-reps").value
      });
      save();
    }
    ui.libSpot = null;
    const rows = document.getElementById("librows");
    if (rows) rows.innerHTML = libRowsHTML();
    return;
  }
  if (act==="libdel"){
    if (!confirm("Remove this exercise from your library? Logged history keeps its name.")) return;
    const e = db.customLib.find(x=>x.id===t.dataset.id);
    if (e) db.customNames[e.id] = e.name; /* keep history readable */
    db.customLib = db.customLib.filter(x=>x.id!==t.dataset.id);
    save(); buildDatalist(); renderLibrary(); return;
  }
  /* ── plan tab ── */
  if (act==="planjump"){
    ui.tab = "plan"; ui.planDay = t.dataset.day; ui.planEdit = null; ui.planAdding = false;
    render(); window.scrollTo(0,0); return;
  }
  if (act==="plantoday"){
    /* jump to the next time this weekday comes around (today counts) */
    const d = new Date();
    while (DAYKEYS[d.getDay()] !== t.dataset.day) d.setDate(d.getDate()+1);
    ui.tab = "today"; ui.viewDate = key(d);
    render(); window.scrollTo(0,0); return;
  }
  if (act==="planday"){
    ui.planDay = t.dataset.day; ui.planEdit = null; ui.planAdding = false;
    renderPlan(); return;
  }
  if (act==="planedit"){ ui.planEdit = t.dataset.key; ui.planAdding = false; renderPlan(); return; }
  if (act==="planeditcancel"){ ui.planEdit = null; renderPlan(); return; }
  if (act==="plansave"){
    const f = t.closest(".editform");
    if (f) saveRoutineItem(ui.planDay, t.dataset.key, {
      name: f.querySelector(".plannamein").value,
      sets: f.querySelector(".ef-sets").value,
      reps: f.querySelector(".ef-reps").value
    });
    ui.planEdit = null;
    save(); renderPlan(); return;
  }
  if (act==="planmove"){
    /* the form re-renders in its new spot — carry over anything typed but not yet saved */
    const f = t.closest(".editform");
    const keep = f ? [...f.querySelectorAll("input")].map(i=>i.value) : null;
    moveRoutineItem(ui.planDay, t.dataset.key, Number(t.dataset.dir));
    save(); renderPlan();
    const nf = document.querySelector(".planedit .editform");
    if (nf && keep) nf.querySelectorAll("input").forEach((i,n)=>{ if (keep[n] != null) i.value = keep[n]; });
    return;
  }
  if (act==="planremove"){
    removeRoutineItem(ui.planDay, t.dataset.key);
    ui.planEdit = null;
    save(); renderPlan(); return;
  }
  if (act==="planrevert"){
    const dov = db.planOv && db.planOv[ui.planDay];
    if (dov){
      delete dov[t.dataset.key];
      if (!Object.keys(dov).length) delete db.planOv[ui.planDay];
    }
    ui.planEdit = null;
    save(); renderPlan(); return;
  }
  if (act==="planrestore"){ restoreHidden(ui.planDay); save(); renderPlan(); return; }
  if (act==="planadd"){
    ui.planAdding = true; ui.planEdit = null;
    renderPlan();
    const inp = document.querySelector(".planaddname");
    if (inp) inp.focus();
    return;
  }
  if (act==="planaddcancel"){ ui.planAdding = false; renderPlan(); return; }
  if (act==="planaddsave"){
    const f = t.closest(".editform");
    const nm = f.querySelector(".plannamein");
    if (!nm.value.trim()){ nm.focus(); return; }
    addRoutineItem(ui.planDay, nm.value.trim(), f.querySelector(".ef-sets").value, f.querySelector(".ef-reps").value);
    ui.planAdding = false;
    save(); renderPlan(); return;
  }
  if (act==="plansugg"){
    const f = t.closest(".editform");
    const inp = f && f.querySelector(".plannamein");
    if (inp) inp.value = t.dataset.name;
    t.parentNode.innerHTML = "";
    return;
  }
  if (act==="planfield"){ ui.planEdit = "@"+t.dataset.field; ui.planAdding = false; renderPlan(); return; }
  if (act==="planfieldsave" || act==="planfieldreset"){
    const k = ui.planDay, field = t.dataset.field, rt = dayRtMake(k);
    const f = t.closest(".editform");
    if (act==="planfieldreset") delete rt[field];
    else if (field==="title"){
      const v = f.querySelector(".plantitlein").value.trim();
      if (!v || v === PLAN[k].title.replace(/\n/g," ")) delete rt.title; else rt.title = v;
    } else if (field==="warmup"){
      const lines = f.querySelector(".planwarmin").value.split("\n").map(x=>x.trim()).filter(Boolean);
      if (lines.join("\n") === (PLAN[k].warmup||[]).join("\n")) delete rt.warmup; else rt.warmup = lines;
    } else if (field==="finish"){
      const v = f.querySelector(".planfinin").value.trim();
      if (v === (PLAN[k].finish||"")) delete rt.finish; else rt.finish = v;
    }
    dayRtTidy(k);
    ui.planEdit = null;
    save(); renderPlan(); return;
  }
  if (act==="planreset"){
    const wd = WDAYS[DAYKEYS.indexOf(ui.planDay)];
    if (!confirm(`Put ${wd} back to the original plan? Your logged workouts stay exactly as they are.`)) return;
    if (db.planOv) delete db.planOv[ui.planDay];
    if (db.routine) delete db.routine[ui.planDay];
    ui.planEdit = null; ui.planAdding = false;
    save(); renderPlan(); return;
  }
  if (act==="gotab"){ ui.tab = t.dataset.tabTo; render(); window.scrollTo(0,0); return; }
  if (act==="cidismiss"){
    db.seen["wk"+t.dataset.wk] = 1;
    if (t.dataset.mark) db.seen["n"+t.dataset.mark] = 1;
    save(); renderToday(); return;
  }
  if (act==="ciaction"){
    saveRoutineItem(t.dataset.day, t.dataset.key, {sets:t.dataset.sets, reps:t.dataset.reps});
    db.seen["ciset"+t.dataset.wk] = [t.dataset.id, t.dataset.day, t.dataset.sets].join("|");
    save(); render(); return;
  }
  if (act==="celebrate"){ celebrate(t, t.dataset.dk); return; }
  if (act==="dance"){
    t.classList.remove("dance");
    void t.getBoundingClientRect();
    t.classList.add("dance");
    return;
  }
  if (act==="winc"||act==="wdec"){
    const r = rec(ui.viewDate, true);
    const ex = t.dataset.ex;
    const entry = r.entries[ex] = r.entries[ex] || {};
    let w = parseFloat(entry.weight);
    if (isNaN(w)){ const lh = lastWeight(ex, ui.viewDate); w = lh?parseFloat(lh.w):0; if(isNaN(w)) w=0; }
    /* light dumbbells move in 2.5s; heavier lifts in 5s */
    w += (act==="winc") ? wStep(w) : -wStep(w - 0.1);
    entry.weight = Math.max(0, w);
    save(); renderToday(); return;
  }
  if (act==="stamp"){
    const r = rec(t.dataset.dk, true);
    /* numbers written down but never marked done would be silently dropped — offer to keep them */
    const stray = Object.entries(r.entries||{}).filter(([,e])=>
      e && !e.done && !(e.sets||[]).some(Boolean) &&
      ((e.weight!=null && e.weight!=="") || e.reps || e.mins));
    if (stray.length){
      const names = stray.map(([id])=>nameOf(id)).join(", ");
      if (confirm(`${names} ${stray.length===1?"has numbers written down but wasn't":"have numbers written down but weren't"} marked done. Log ${stray.length===1?"it":"them"} too?`)){
        for (const [,e] of stray) e.done = true;
      }
    }
    r.stamped = true; r.stampedAt = new Date().toISOString();
    save();
    celebrate(t, t.dataset.dk);
    ui.dance = true;
    renderToday();
    ui.dance = false;
    return;
  }
  if (act==="unstamp"){
    const r = rec(t.dataset.dk, true);
    r.stamped = false;
    save(); renderToday(); return;
  }
  if (act==="mnav"){
    let [y,m]=ui.calMonth; m+=Number(t.dataset.dir);
    if (m<0){m=11;y--;} if (m>11){m=0;y++;}
    ui.calMonth=[y,m]; renderLog(); return;
  }
  if (act==="rhythmwk"){
    const d = fromKey(t.dataset.dk);
    ui.calMonth = [d.getFullYear(), d.getMonth()]; ui.calSel = t.dataset.dk;
    renderLog(); return;
  }
  if (act==="calsel"){ ui.calSel=t.dataset.dk; renderLog(); return; }
  if (act==="delentry"){
    const w = db.workouts[t.dataset.dk];
    if (w){
      if (w.entries) delete w.entries[t.dataset.ex];
      w.extras = (w.extras||[]).filter(x=>x!==t.dataset.ex);
      gcDay(t.dataset.dk);
    }
    save(); renderLog(); return;
  }
  if (act==="clearday"){
    if (confirm("Delete everything logged on this day?")){
      delete db.workouts[t.dataset.dk];
      save(); renderLog();
    }
    return;
  }
  if (act==="prog"){ ui.progOpen = ui.progOpen===t.dataset.ex ? null : t.dataset.ex; renderProgress(); return; }
  if (act==="export"){
    const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "keiko-log-"+key(new Date())+".json";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    db.settings.lastExport = key(new Date());
    save(); render(); return;
  }
  if (act==="import"){ $("#importFile").click(); return; }
});

/* weight & reps inputs */
document.addEventListener("change", e=>{
  const el = e.target;
  if (el.classList.contains("wtin")){
    const r = rec(ui.viewDate, true);
    const entry = r.entries[el.dataset.ex] = r.entries[el.dataset.ex] || {};
    const v = parseFloat(el.value);
    entry.weight = isNaN(v) ? "" : v;
    save();
  }
  if (el.classList.contains("repsin")){
    const r = rec(ui.viewDate, true);
    const entry = r.entries[el.dataset.ex] = r.entries[el.dataset.ex] || {};
    if (el.dataset.mins) entry.mins = el.value.trim();
    else entry.reps = el.value.trim();
    save();
  }
  if (el.id==="clImg"){
    const f = el.files && el.files[0];
    if (f) processLibImage(f, data=>{
      ui.libImg = data;
      const keepName = (document.getElementById("clName")||{}).value || "";
      const keepCat = (document.getElementById("clCat")||{}).value || "Lower body";
      const keepNotes = (document.getElementById("clNotes")||{}).value || "";
      const zone = document.getElementById("libformzone");
      if (zone){
        zone.innerHTML = libFormHTML();
        document.getElementById("clName").value = keepName;
        document.getElementById("clCat").value = keepCat;
        document.getElementById("clNotes").value = keepNotes;
      }
    });
    return;
  }
  if (el.id==="sessSel"){
    const r = rec(ui.viewDate, true);
    const def = DAYKEYS[fromKey(ui.viewDate).getDay()];
    if (el.value===def) delete r.session; else r.session = el.value;
    save(); renderToday();
  }
  if (el.classList.contains("swapin")) commitSwapInput(el);
});
/* shared by the swap/add input's change event and the suggestion chips */
function commitSwapInput(el, forcedName){
  const name = (forcedName != null ? forcedName : el.value).trim();
  if (el.dataset.adding){
    ui.adding = false;
    if (name){
      const id = resolveExId(name);
      const r = rec(ui.viewDate, true);
      if (!r.extras.includes(id)) r.extras.push(id);
      save();
    }
  } else if (el.dataset.key){
    const key = el.dataset.key;
    ui.swapping = null;
    if (name){
      const id = resolveExId(name);
      const r = rec(ui.viewDate, true);
      r.subs[key] = {id, name: nameOf(id)};
      save();
    }
  }
  renderToday();
}
/* suggestion chips commit on pointerdown — before the input blurs away */
document.addEventListener("pointerdown", e=>{
  const b = e.target.closest('[data-act="suggpick"]');
  if (!b) return;
  e.preventDefault();
  const inp = document.querySelector(".swapin");
  if (inp) commitSwapInput(inp, b.dataset.name);
});
document.addEventListener("input", e=>{
  if (e.target.id==="libq"){
    ui.libq = e.target.value;
    const rows = document.getElementById("librows");
    if (rows) rows.innerHTML = libRowsHTML();
  }
  if (e.target.classList && e.target.classList.contains("plannamein")){
    const box = e.target.parentNode.querySelector(".plansugg");
    const q = e.target.value.trim().toLowerCase();
    if (box) box.innerHTML = q
      ? allExNames().filter(n=>n.toLowerCase().includes(q) && n.toLowerCase()!==q).slice(0,6)
          .map(n=>`<button class="choice" data-act="plansugg" data-name="${esc(n)}">${esc(n)}</button>`).join("")
      : "";
  }
  if (e.target.classList && e.target.classList.contains("swapin")){
    const box = document.querySelector(".swapsugg");
    if (!box) return;
    const q = e.target.value.trim().toLowerCase();
    box.innerHTML = q
      ? allExNames().filter(n=>n.toLowerCase().includes(q)).slice(0,6)
          .map(n=>`<button class="choice" data-act="suggpick" data-name="${esc(n)}">${esc(n)}</button>`).join("")
      : "";
  }
});
document.addEventListener("focusout", e=>{
  const el = e.target;
  if (el.classList && el.classList.contains("swapin") && (ui.swapping || ui.adding) && !el.value.trim()){
    ui.swapping = null; ui.adding = false; renderToday();
  }
  if (el.classList && el.classList.contains("notein")){
    const dk = el.dataset.dk;
    const v = el.value.trim();
    const r = rec(dk, true);
    if (v) r.note = v; else delete r.note;
    ui.noting = null;
    gcDay(dk);
    save();
    if (ui.tab==="log") renderLog(); else renderToday();
  }
});
$("#importFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try {
      const parsed = JSON.parse(rd.result);
      if (!parsed || typeof parsed.workouts!=="object") throw new Error("bad file");
      db = parsed;
      db.settings = db.settings || {express:false};
      db.settings.programStart = db.settings.programStart || "2026-05-25";
      db.customNames = db.customNames || {};
      db.customLib = db.customLib || [];
      db.seen = db.seen || {};
      save(); buildDatalist(); render();
    } catch(err){ alert("That file doesn't look like a Keiko export."); }
  };
  rd.readAsText(f);
  e.target.value = "";
});

/* ══════ touch: swipe rows for actions, swipe the day card to change days ══════ */
let touchS = null;
document.addEventListener("touchstart", e=>{
  const el = e.target;
  if (el.closest(".rowactions")){ touchS = null; return; }
  const row = el.closest("li.exrow");
  const head = el.closest(".dayhead");
  if (!row && !head){ touchS = null; return; }
  const p = e.touches[0];
  touchS = {x:p.clientX, y:p.clientY, row, head, slide: row ? row.querySelector(".rowslide") : null, horiz:null};
}, {passive:true});
document.addEventListener("touchmove", e=>{
  if (!touchS || !touchS.slide) return;
  const p = e.touches[0];
  const dx = p.clientX - touchS.x, dy = p.clientY - touchS.y;
  if (touchS.horiz===null && (Math.abs(dx)>6 || Math.abs(dy)>6)) touchS.horiz = Math.abs(dx) > Math.abs(dy)*1.2;
  if (!touchS.horiz) return;
  const tray = parseFloat(getComputedStyle(touchS.row).getPropertyValue("--tray")) || 212;
  const base = touchS.row.classList.contains("open") ? -tray : 0;
  let off = base + dx;
  if (off < -tray) off = -tray + (off + tray)/3; /* rubber-band resistance past the tray */
  if (off > 0) off = off/3;                      /* …and when pulling the wrong way */
  off = Math.max(-tray-30, Math.min(12, off));
  touchS.slide.classList.add("dragging");
  touchS.slide.style.transform = `translateX(${off}px)`;
}, {passive:true});
document.addEventListener("touchend", e=>{
  if (!touchS) return;
  const p = e.changedTouches[0];
  const dx = p.clientX - touchS.x, dy = p.clientY - touchS.y;
  if (touchS.head && touchS.head.classList.contains("plancard")){
    /* on the Plan tab, swiping the day card steps through the weekdays */
    if (Math.abs(dx)>55 && Math.abs(dy)<45 && ui.planEdit==null){
      const i = WEEK_ORDER.indexOf(ui.planDay) + (dx<0?1:-1);
      ui.planDay = WEEK_ORDER[(i+7)%7]; ui.planAdding = false;
      renderPlan();
    }
  } else if (touchS.head){
    if (Math.abs(dx)>55 && Math.abs(dy)<45){
      const d = fromKey(ui.viewDate); d.setDate(d.getDate()+(dx<0?1:-1));
      ui.viewDate = key(d);
      renderToday();
    }
  } else if (touchS.slide){
    touchS.slide.classList.remove("dragging");
    touchS.slide.style.transform = "";
    const wasOpen = touchS.row.classList.contains("open");
    const shouldOpen = touchS.horiz && (wasOpen ? dx < 30 : dx < -36);
    document.querySelectorAll("li.exrow.open").forEach(li=>li.classList.remove("open"));
    ui.rowOpen = null;
    if (shouldOpen){
      touchS.row.classList.add("open");
      ui.rowOpen = touchS.row.dataset.rowkey;
      if (!db.seen.rowhint || !db.seen.sethint){ db.seen.rowhint = 1; db.seen.sethint = 1; save(); }
    }
  }
  touchS = null;
}, {passive:true});

buildDatalist();
render();

/* a home-screen app can sit in memory overnight — when it comes back on a new day,
   move "today" along with it (unless she'd deliberately navigated to another date) */
let shownToday = key(new Date());
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden) return;
  const now = key(new Date());
  if (now === shownToday) return;
  if (ui.viewDate === shownToday) ui.viewDate = now;
  if (ui.calSel === shownToday){ ui.calSel = now; const t = new Date(); ui.calMonth = [t.getFullYear(), t.getMonth()]; }
  shownToday = now;
  render();
});

/* offline shell + durable storage — months of logs shouldn't hinge on a cache sweep */
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
